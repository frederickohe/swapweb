name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-swapweb-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build
          tar -czf dist.tgz -C dist .

      - name: Upload build to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: dist.tgz
          target: /tmp

      - name: Install build and restart Caddy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p /var/www/swapweb/dist
            rm -rf /var/www/swapweb/dist/*
            tar -xzf /tmp/dist.tgz -C /var/www/swapweb/dist
            rm -f /tmp/dist.tgz
            chmod -R a+rX /var/www/swapweb/dist
            cd /var/www/swapprocaddy
            docker compose restart caddy
            echo "swapweb deploy complete"
